<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem('sc8-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>เครื่องคิดเลขวิทยาศาสตร์ SC-8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper:#f3f3f1; --ink:#0b0b0b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#0b0b0b; --ink:#f3f3f1; } }
:root[data-theme="dark"]{ --paper:#0b0b0b; --ink:#f3f3f1; }
:root{ --mute:color-mix(in srgb,var(--ink) 9%,var(--paper)); --faint:color-mix(in srgb,var(--ink) 55%,transparent); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100%;margin:0;display:flex;padding:72px 22px 22px;
  font-family:'Chakra Petch',system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 24%,transparent) 1px,transparent 1.7px);
  background-size:12px 12px;
}
.calc{
  width:min(100%,1060px);margin:auto;padding:18px 20px 24px;background:var(--paper);
  border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink);
}
.top{display:flex;align-items:center;gap:16px;padding-bottom:12px;margin-bottom:16px;border-bottom:3px solid var(--ink);font-weight:700;font-size:15px;white-space:nowrap}
.top b{font-size:24px;letter-spacing:1px;padding:0 8px;background:var(--ink);color:var(--paper)}
.bars{flex:1;height:16px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 15px)}
.lcd{
  position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3.2fr);gap:18px;
  min-height:180px;padding:16px 24px 30px;margin-bottom:22px;background:var(--ink);color:var(--paper);
  outline:2px solid var(--paper);outline-offset:-8px;
}
.side{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding-right:16px;border-right:1px dashed var(--faint);min-width:0}
.stat{display:flex;gap:8px;font-size:12px;font-weight:700}
.stat span{padding:1px 7px;border:1px solid var(--paper);opacity:.35}
.stat span.on{opacity:1;background:var(--paper);color:var(--ink)}
.hist{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.hist button{all:unset;cursor:pointer;font-size:13px;opacity:.65;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist button:hover,.hist button:focus-visible{opacity:1;text-decoration:underline}
.hist button:focus-visible{outline:2px dashed var(--paper);outline-offset:2px}
.mainv{display:flex;flex-direction:column;justify-content:flex-end;text-align:right;min-width:0}
#expr{min-height:26px;font-size:19px;letter-spacing:.5px;opacity:.65;overflow-wrap:anywhere}
#out{font-size:78px;font-weight:700;line-height:1.05;letter-spacing:-1px;overflow-wrap:anywhere;margin-top:4px}
#out.m{font-size:54px}#out.s{font-size:36px}#out.err{font-size:24px;letter-spacing:0}
.ruler{position:absolute;left:0;right:0;bottom:0;height:12px;opacity:.55;
  background:linear-gradient(90deg,var(--paper) 1px,transparent 1px) 0 100%/48px 12px repeat-x,linear-gradient(90deg,var(--paper) 1px,transparent 1px) 0 100%/8px 6px repeat-x}
.heat{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--paper);opacity:0}
.heat.go{animation:sweep .7s ease-out}
@keyframes sweep{0%{transform:scaleX(0);transform-origin:left;opacity:1}100%{transform:scaleX(1);transform-origin:left;opacity:0}}
.deck{display:grid;grid-template-columns:2fr 4fr 2fr;gap:24px}
.wing{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:54px;gap:12px 10px;padding:12px;border:2px dashed var(--ink);
  background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink) 12%,transparent) 6px 7px)}
.wing.mid{grid-template-columns:repeat(4,1fr);gap:12px;border-style:solid;background:none}
button.k{
  font:700 22px 'Chakra Petch',system-ui,sans-serif;border:2px solid var(--ink);border-radius:0;cursor:pointer;
  color:var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--ink);
  transition:transform .06s,box-shadow .06s,background .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.wing:not(.mid) .k{font-size:16px}
button.k:hover{background:var(--mute)}
button.k:active,button.k.down{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
button.k:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.k.fn{background:var(--mute)}
.k.op,.k.on,.k.eq{background:var(--ink);color:var(--paper)}
.k.op{font-size:28px}
.k.op:hover,.k.on:hover,.k.eq:hover{background:var(--ink);opacity:.86}
.k.eq{font-size:32px;background-image:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--paper) 16%,transparent) 10px 12px)}
.k.w3{grid-column:span 3}
@media (max-width:920px){
  .deck{grid-template-columns:1fr 1fr;gap:18px}
  .wing.mid{grid-column:1/-1;order:-1}
  .lcd{grid-template-columns:1fr;min-height:0}
  .side{flex-direction:row;align-items:flex-start;justify-content:space-between;padding:0 0 10px;border-right:0;border-bottom:1px dashed var(--faint)}
  #out{font-size:56px}#out.m{font-size:42px}#out.s{font-size:28px}
}
@media (max-width:520px){
  body{padding:66px 12px 12px}.calc{padding:12px;box-shadow:6px 6px 0 var(--ink)}
  .top span{display:none}.wing{padding:8px;gap:10px 8px;grid-auto-rows:46px}.wing.mid{gap:10px 8px}
  .wing:not(.mid) .k{font-size:14px}button.k{box-shadow:3px 3px 0 var(--ink)}
  #out{font-size:44px}.lcd{padding:12px 16px 24px}
}
@media (prefers-reduced-motion:reduce){.heat.go{animation:none}button.k{transition:none}}
#tip{position:fixed;left:0;top:0;z-index:50;max-width:230px;padding:8px 11px;pointer-events:none;
  background:var(--ink);color:var(--paper);border:2px solid var(--paper);box-shadow:0 0 0 2px var(--ink),4px 4px 0 2px var(--ink);
  font-size:13px;line-height:1.4;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip b{display:block;font-size:15px;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
.hbtn,.tb{
  display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;font:700 16px 'Chakra Petch',system-ui,sans-serif;
  color:var(--ink);background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;
  transition:transform .06s,box-shadow .06s}
.hbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.hbtn:focus-visible,.hpanel button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.hbtn i{font-style:normal;min-width:24px;padding:0 6px;text-align:center;background:var(--ink);color:var(--paper);font-size:14px;line-height:22px}
.hbtn .caret{display:inline-block;transition:transform .16s}
.hbtn.open{background:var(--ink);color:var(--paper)}
.hbtn.open i{background:var(--paper);color:var(--ink)}
.hbtn.open .caret{transform:rotate(180deg)}
.hbtn.open:focus-visible{outline-color:var(--ink)}
.hpanel{position:fixed;z-index:40;top:calc(14px + 44px + 14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));
  width:min(400px,calc(100vw - 28px));max-height:min(68vh,560px);display:flex;flex-direction:column;
  background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
  transform-origin:top right;opacity:0;visibility:hidden;transform:translateY(-14px) scaleY(.94);pointer-events:none;
  transition:opacity .16s,transform .16s,visibility 0s linear .16s}
.hpanel.open{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .16s,transform .16s,visibility 0s}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--ink);color:var(--paper)}
.hhead b{font-size:16px}
.hclr{font:700 13px 'Chakra Petch',system-ui,sans-serif;color:var(--paper);background:none;border:1px solid var(--paper);padding:3px 10px;cursor:pointer}
.hclr:hover{background:var(--paper);color:var(--ink)}
.hhead button:focus-visible{outline-color:var(--paper)}
#hlist{list-style:none;margin:0;padding:0;overflow:auto;overscroll-behavior:contain}
#hlist li{position:relative;display:grid;gap:2px;padding:10px 14px;border-bottom:1px dashed var(--ink)}
#hlist li:hover{background:var(--mute)}
#hlist time{position:absolute;top:10px;right:14px;font-size:12px;opacity:.55}
.he,.hr{all:unset;cursor:pointer;display:block;max-width:calc(100% - 60px);overflow-wrap:anywhere}
.he{font-size:14px;opacity:.65}.hr{font-size:22px;font-weight:700}
.he:hover,.hr:hover{text-decoration:underline}
.hempty{padding:22px 14px!important;font-size:14px;opacity:.65}
@media (prefers-reduced-motion:reduce){.hpanel,.hbtn,.hbtn .caret{transition:none}}
.tools{position:fixed;z-index:41;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start}
.tb:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.tb:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.tb.open{background:var(--ink);color:var(--paper)}
.tb .caret{display:inline-block;transition:transform .16s}
.tb.open .caret{transform:rotate(180deg)}
.lwrap{position:relative}
.lmenu{position:absolute;top:calc(100% + 12px);right:0;width:min(230px,calc(100vw - 28px));display:flex;flex-direction:column;
  background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
  opacity:0;visibility:hidden;transform:translateY(-12px);pointer-events:none;transition:opacity .16s,transform .16s,visibility 0s linear .16s}
.lmenu.open{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .16s,transform .16s,visibility 0s}
.lmenu button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--ink);font-weight:700;font-size:16px}
.lmenu button:last-child{border-bottom:0}
.lmenu button span:last-child{opacity:.6;font-weight:400}
.lmenu button:hover{background:var(--mute)}
.lmenu button.on{background:var(--ink);color:var(--paper)}
.lmenu button:focus-visible{outline:3px dashed var(--ink);outline-offset:-5px}
.lmenu button.on:focus-visible{outline-color:var(--paper)}
.k .dg{display:block;font-size:22px;line-height:1.05}
.k .dr{display:block;font-size:10px;font-weight:600;line-height:1.15;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#say{display:grid;gap:4px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--faint);font-size:16px;line-height:1.35}
#say[hidden]{display:none}
#say div{overflow-wrap:anywhere}
#say i{font-style:normal;font-size:11px;margin-right:10px;padding:0 6px;border:1px solid var(--paper);opacity:.6}
@media (max-width:520px){.tb .t{display:none}.hbtn,.tb{padding:0 10px}.tools{gap:8px}#say{font-size:14px}.k .dg{font-size:19px}.k .dr{font-size:9px}}
@media (prefers-reduced-motion:reduce){.lmenu,.tb .caret{transition:none}}
</style>
</head>
<body>
<main class="calc" aria-label="เครื่องคิดเลขวิทยาศาสตร์">
  <header class="top"><b>SC-8</b><i class="bars"></i><span>เครื่องคิดเลขวิทยาศาสตร์</span></header>
  <section class="lcd" aria-live="polite">
    <div class="side">
      <div class="stat"><span id="sDeg" class="on">DEG</span><span id="s2nd">2nd</span><span id="sM">M</span></div>
      <div class="hist" id="hist"></div>
    </div>
    <div class="mainv"><div id="expr"></div><div id="out">0</div>
      <div id="say" hidden><div><i>เขียน</i><span id="sayW"></span></div><div><i>อ่าน</i><span id="sayR"></span></div></div>
    </div>
    <div class="ruler"></div><div class="heat" id="heat"></div>
  </section>
  <div class="deck">
    <div class="wing" id="wl"></div>
    <div class="wing mid" id="mid"></div>
    <div class="wing" id="wr"></div>
  </div>
</main>
<div class="tools">
  <button class="tb" id="tbtn" aria-label="สลับโหมดกลางวัน กลางคืน"><span id="ticon" aria-hidden="true">☀</span><span class="t" id="ttxt">กลางวัน</span></button>
  <div class="lwrap" id="lwrap">
    <button class="tb" id="lbtn" aria-haspopup="true" aria-expanded="false" aria-controls="lmenu" aria-label="เลือกภาษาสำหรับคำอ่านตัวเลข"><span aria-hidden="true">A文</span><span class="t" id="ltxt">ภาษา</span><span class="caret" aria-hidden="true">▾</span></button>
    <div class="lmenu" id="lmenu" role="group" aria-label="เลือกภาษาที่ใช้อ่านตัวเลข"></div>
  </div>
  <button class="hbtn tb" id="hbtn" aria-expanded="false" aria-controls="hpanel">ประวัติ <i id="hcount">0</i><span class="caret" aria-hidden="true">▾</span></button>
</div>
<aside class="hpanel" id="hpanel" aria-label="ประวัติการคำนวณ">
  <div class="hhead"><b>ประวัติการคำนวณ</b><button class="hclr" id="hclr">ล้างทั้งหมด</button></div>
  <ol id="hlist"></ol>
</aside>

<script>
(function(){
  var LEFT=[
    ['2nd','!2ND'],['DEG','!DEG'],['sin','sin(','sin⁻¹','asin('],['cos','cos(','cos⁻¹','acos('],
    ['tan','tan(','tan⁻¹','atan('],['π','π'],['log','log(','10ˣ','10^('],['ln','ln(','eˣ','e^('],
    ['xʸ','^'],['e','e'],['EXP','EXP'],['Rand','!RAND']
  ];
  var RIGHT=[
    ['√','√(','∛','∛('],['x²','^2','x³','^3'],['x!','!','sinh','sinh('],['1/x','^(−1)','cosh','cosh('],
    ['|x|','abs(','tanh','tanh('],['mod','mod'],['nCr','C','nPr','P'],['Ans','Ans'],
    ['MC','!MC'],['MR','!MR'],['M+','!MP'],['M−','!MM']
  ];
  var PAD=[
    ['AC','!AC','fn'],['⌫','!BS','fn'],['(','(','fn'],[')',')','fn'],
    ['7','7'],['8','8'],['9','9'],['÷','÷','op'],
    ['4','4'],['5','5'],['6','6'],['×','×','op'],
    ['1','1'],['2','2'],['3','3'],['−','−','op'],
    ['±','!SIGN','fn'],['0','0'],['.','.'],['+','+','op'],
    ['%','%','fn'],['=','!EQ','eq w3']
  ];
  var sci=document.getElementById('wl'), sci2=document.getElementById('wr'), pad=document.getElementById('mid'),
      exprEl=document.getElementById('expr'), out=document.getElementById('out'),
      histEl=document.getElementById('hist'), heat=document.getElementById('heat'),
      sDeg=document.getElementById('sDeg'), s2nd=document.getElementById('s2nd'), sM=document.getElementById('sM');
  var DEG=true, second=false, mem=0, ans=0, expr='', done=false, hist=[], errMsg='', lastGood='0';
  var btns=[];

  function mk(d,box,cls){
    var b=document.createElement('button');
    b.className='k'+(cls?' '+cls:'');
    b.dataset.la=d[0]; b.dataset.ka=d[1];
    if(d[3]){ b.dataset.lb=d[2]; b.dataset.kb=d[3]; }
    b.textContent=d[0];
    b.setAttribute('aria-label',d[0]);
    box.appendChild(b); btns.push(b);
  }
  LEFT.forEach(function(d){ mk(d,sci,''); });
  RIGHT.forEach(function(d){ mk(d,sci2,''); });
  PAD.forEach(function(d){ mk(d,pad,d[2]); });
  function keyOf(b){ return second&&b.dataset.kb?b.dataset.kb:b.dataset.ka; }
  function relabel(){
    btns.forEach(function(b){
      if(b.dataset.kb){ b.textContent=second?b.dataset.lb:b.dataset.la; b.setAttribute('aria-label',b.textContent); }
      var k=b.dataset.ka;
      if(k==='!2ND') b.classList.toggle('on',second);
      if(k==='!DEG'){ b.textContent=DEG?'DEG':'RAD'; b.classList.add('on'); }
    });
  }

  /* ---------- parser ---------- */
  var FN=['sin','cos','tan','asin','acos','atan','sinh','cosh','tanh','log','ln','abs','√','∛'];
  var TOK=/^(?:(\d+\.?\d*|\.\d+)(?:E([+−-]?\d+))?|(asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|log|ln|abs|Ans|mod|C|P|e|π|√|∛)|([+−×÷^!%()-]))/;
  function fail(m){ throw new Error(m); }
  function fact(n){ if(n!==Math.floor(n)||n<0||n>170) fail('x! ต้องเป็นจำนวนเต็ม 0–170'); var r=1; for(var i=2;i<=n;i++) r*=i; return r; }
  function nCr(n,r,perm){
    if(n!==Math.floor(n)||r!==Math.floor(r)||r<0||r>n) fail('nCr/nPr ต้องเป็นจำนวนเต็ม และ 0 ≤ r ≤ n');
    var v=1; for(var i=0;i<r;i++){ v*=(n-i); if(!perm) v/=(i+1); } return Math.round(v);
  }
  function fn(name,a){
    var k=DEG?Math.PI/180:1, r;
    switch(name){
      case 'sin': r=Math.sin(a*k); break;
      case 'cos': r=Math.cos(a*k); break;
      case 'tan':
        if(DEG?Math.abs(a%180)===90:Math.abs(Math.cos(a))<1e-15) fail('tan ไม่มีค่าที่มุมนี้');
        r=Math.tan(a*k); break;
      case 'asin': case 'acos':
        if(Math.abs(a)>1) fail('ค่าต้องอยู่ระหว่าง −1 ถึง 1');
        r=(name==='asin'?Math.asin(a):Math.acos(a))/k; break;
      case 'atan': r=Math.atan(a)/k; break;
      case 'sinh': r=Math.sinh(a); break;
      case 'cosh': r=Math.cosh(a); break;
      case 'tanh': r=Math.tanh(a); break;
      case 'log': if(a<=0) fail('log ต้องใช้ค่ามากกว่า 0'); r=Math.log10(a); break;
      case 'ln': if(a<=0) fail('ln ต้องใช้ค่ามากกว่า 0'); r=Math.log(a); break;
      case '√': if(a<0) fail('รากที่สองของจำนวนลบไม่ได้'); r=Math.sqrt(a); break;
      case '∛': r=Math.cbrt(a); break;
      case 'abs': r=Math.abs(a); break;
    }
    return Math.abs(r)<1e-15?0:r;
  }
  function ev(s){
    var t=[], m;
    while(s.length){
      m=s.match(TOK); if(!m) fail('รูปแบบไม่ถูกต้อง');
      s=s.slice(m[0].length);
      if(m[1]!==undefined) t.push({n:parseFloat(m[1]+(m[2]?'e'+m[2].replace('−','-'):''))});
      else t.push({s:m[3]||m[4]});
    }
    if(!t.length) fail('ไม่มีนิพจน์');
    var p=0;
    function pk(){ return t[p]; }
    function isVal(x){ return x&&(x.n!==undefined||x.s==='π'||x.s==='e'||x.s==='Ans'||x.s==='('||FN.indexOf(x.s)>-1); }
    function expr(){
      var v=term();
      while(pk()&&(pk().s==='+'||pk().s==='−'||pk().s==='-')){ var o=t[p++].s; var r=term(); v=o==='+'?v+r:v-r; }
      return v;
    }
    function term(){
      var v=unary(), x;
      for(;;){
        x=pk();
        if(x&&(x.s==='×'||x.s==='÷'||x.s==='mod'||x.s==='C'||x.s==='P')){
          p++; var r=unary();
          if(x.s==='×') v*=r;
          else if(x.s==='÷'){ if(r===0) fail('หารด้วย 0 ไม่ได้'); v/=r; }
          else if(x.s==='mod'){ if(r===0) fail('mod ด้วย 0 ไม่ได้'); v=v%r; }
          else v=nCr(v,r,x.s==='P');
        }else if(isVal(x)){ v*=unary(); }
        else break;
      }
      return v;
    }
    function unary(){
      var x=pk();
      if(x&&(x.s==='−'||x.s==='-')){ p++; return -unary(); }
      if(x&&x.s==='+'){ p++; return unary(); }
      return power();
    }
    function power(){
      var b=post();
      if(pk()&&pk().s==='^'){ p++; var e=unary(); var r=Math.pow(b,e); if(isNaN(r)) fail('คำนวณไม่ได้'); return r; }
      return b;
    }
    function post(){
      var v=prim();

    'log(':'ลอการิทึมฐาน 10 เช่น log(1000) = 3',
    'ln(':'ลอการิทึมธรรมชาติ (ฐาน e)',
    '10^(':'สิบยกกำลัง เช่น 10^(3) = 1000',
    'e^(':'e ยกกำลัง เช่น e^(1) = 2.718…',
    '^':'ยกกำลัง เช่น 2 xʸ 3 = 8',
    'EXP':'ใส่เลขชี้กำลังฐาน 10 เช่น 5 EXP 3 = 5×10³',
    '!RAND':'สุ่มเลขทศนิยมระหว่าง 0 ถึง 1',
    '√(':'รากที่สอง เช่น √(9) = 3',
    '∛(':'รากที่สาม เช่น ∛(27) = 3',
    '^2':'ยกกำลังสอง เช่น 5 x² = 25',
    '^3':'ยกกำลังสาม เช่น 3 x³ = 27',
    '!':'แฟกทอเรียล เช่น 5! = 120 (จำนวนเต็ม 0–170)',
    'sinh(':'ไฮเพอร์โบลิกไซน์',
    'cosh(':'ไฮเพอร์โบลิกโคไซน์',
    'tanh(':'ไฮเพอร์โบลิกแทนเจนต์',
    '^(−1)':'ส่วนกลับ คือ 1 หารด้วยค่านั้น เช่น 4 → 0.25',
    'abs(':'ค่าสัมบูรณ์ เช่น |−5| = 5',
    'mod':'เศษจากการหาร เช่น 10 mod 3 = 1',
    'C':'จำนวนวิธีเลือก r จาก n แบบไม่สนลำดับ เช่น 5 nCr 2 = 10',
    'P':'จำนวนวิธีจัดเรียง r จาก n แบบสนลำดับ เช่น 5 nPr 2 = 20',
    'Ans':'ใช้ผลลัพธ์ล่าสุดที่คำนวณไว้',
    '!MC':'ล้างค่าในหน่วยความจำ',
    '!MR':'เรียกค่าในหน่วยความจำมาใช้',
    '!MP':'บวกค่าปัจจุบันเข้าหน่วยความจำ',
    '!MM':'ลบค่าปัจจุบันออกจากหน่วยความจำ',
    '!AC':'ล้างนิพจน์ทั้งหมด (คีย์ลัด Esc)',
    '!BS':'ลบตัวอักษรตัวสุดท้าย (คีย์ลัด Backspace)',
    '(':'เปิดวงเล็บ ใช้กำหนดลำดับการคำนวณ',
    ')':'ปิดวงเล็บ',
    '÷':'หาร','×':'คูณ','−':'ลบ','+':'บวก',
    '.':'จุดทศนิยม',
    '!SIGN':'สลับค่าบวก/ลบของตัวเลขล่าสุด',
    '%':'หารด้วย 100 เช่น 50% = 0.5',
    '!EQ':'คำนวณผลลัพธ์ (คีย์ลัด Enter)'
  };
  var tip=document.createElement('div'); tip.id='tip'; tip.setAttribute('role','tooltip');
  document.body.appendChild(tip);
  var tipBtn=null, tipTimer=0;
  function showTip(b){
    var d=TIPS[keyOf(b)]; if(!d){ hideTip(); return; }
    tipBtn=b;
    tip.innerHTML='<b></b><span></span>';
    tip.firstChild.textContent=(b.dataset.kb||b.dataset.ka==='!DEG')?b.textContent:b.dataset.la; tip.lastChild.textContent=d;
    tip.style.left='0px'; tip.style.top='0px';
    var r=b.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    var x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8);
    var y=r.top-h-12; if(y<8) y=r.bottom+12;
    tip.style.left=x+'px'; tip.style.top=y+'px';
    tip.classList.add('show'); b.setAttribute('aria-describedby','tip');
  }
  function hideTip(){
    clearTimeout(tipTimer); tip.classList.remove('show');
    if(tipBtn){ tipBtn.removeAttribute('aria-describedby'); tipBtn=null; }
  }
  var calcEl=document.querySelector('.calc');
  calcEl.addEventListener('pointerover',function(e){
    if(e.pointerType!=='mouse') return;
    var b=e.target.closest('button.k'); if(!b||b===tipBtn) return;
    hideTip(); tipTimer=setTimeout(function(){ showTip(b); },250);
  });
  calcEl.addEventListener('pointerout',function(e){ if(e.pointerType==='mouse'&&e.target.closest('button.k')) hideTip(); });
  calcEl.addEventListener('focusin',function(e){ var b=e.target.closest('button.k'); if(b&&b.matches(':focus-visible')) showTip(b); });
  calcEl.addEventListener('focusout',hideTip);
  calcEl.addEventListener('click',function(e){ var b=e.target.closest('button.k'); if(b&&b===tipBtn) showTip(b); });
  window.addEventListener('scroll',hideTip,true);

  render();
})();
</script>
</body>
</html>
